[server]
host = "127.0.0.1"
port = 8765
allow_non_loopback = false

[auth]
token_file = "/etc/noob/auth.key"
local_token_file = "/etc/noob/local-console.key"

[serial]
device = "/dev/serial/by-id/usb-FTDI_Single_RS232-HS-if00-port0"
baudrate = 115200
ack_timeout_ms = 750
heartbeat_ms = 500
watchdog_ms = 2000
reconnect_ms = 500
max_pending_commands = 8

[video]
device = "/dev/v4l/by-id/usb-MACROSILICON_C7-1_USB3_Video_20210621-video-index0"
v4l2_ctl = "/usr/bin/v4l2-ctl"
default_mode = "720p20"
max_frame_bytes = 8388608
stale_seconds = 2.0
switch_timeout_seconds = 5.0
reconnect_ms = 1000
max_clients = 4

[[video.profiles]]
mode_id = "720p20"
label = "1280 x 720 - 20 fps"
width = 1280
height = 720
fps = 20
pixel_format = "MJPG"
max_frame_bytes = 1843200
validated = true

[[video.profiles]]
mode_id = "720p30"
label = "1280 x 720 - 30 fps"
width = 1280
height = 720
fps = 30
pixel_format = "MJPG"
max_frame_bytes = 1843200
validated = true

[[video.profiles]]
mode_id = "1080p30"
label = "1920 x 1080 - 30 fps"
width = 1920
height = 1080
fps = 30
pixel_format = "MJPG"
max_frame_bytes = 4147200
validated = true

[[video.profiles]]
mode_id = "1440p30"
label = "2560 x 1440 - 30 fps"
width = 2560
height = 1440
fps = 30
pixel_format = "MJPG"
max_frame_bytes = 7372800
validated = true

[[video.profiles]]
mode_id = "1200p30"
label = "1920 x 1200 - 30 fps"
width = 1920
height = 1200
fps = 30
pixel_format = "MJPG"
max_frame_bytes = 4608000
validated = true

[[video.profiles]]
mode_id = "1600p30"
label = "2560 x 1600 - 30 fps"
width = 2560
height = 1600
fps = 30
pixel_format = "MJPG"
max_frame_bytes = 8192000
validated = true

# Populate the camera's assigned RFC1918 address and its separate bearer token,
# then set enabled=true after firmware acceptance. Optional camera failure never
# participates in the target HDMI/HID /readyz decision.
[environment_camera]
enabled = false
# host = "192.168.50.84"
# expected_device_id = "cam_0123456789abcdef"
port = 80
# token_file = "/etc/noob/environment-camera.key"
connect_timeout_seconds = 1.5
request_timeout_seconds = 4.0
stream_read_timeout_seconds = 10.0
status_interval_seconds = 2.0
reconnect_ms = 1000
stale_seconds = 3.0
max_frame_bytes = 2097152
max_metadata_bytes = 65536
max_media_bytes = 67108864
max_clients = 2
max_page_size = 50
max_clip_seconds = 30
max_clip_fps = 5

[limits]
max_body_bytes = 4096
max_type_chars = 512
input_rate_per_second = 120
input_burst = 60
lease_ttl_seconds = 5.0

[local_input]
enabled = true
keyboard_device = "/dev/input/by-id/usb-ClockworkPI_uConsole_20230713-event-kbd"
pointer_device = "/dev/input/by-id/usb-ClockworkPI_uConsole_20230713-event-mouse"
# Legacy compatibility field; accepted but ignored by native button mapping.
long_press_ms = 650
lease_idle_ms = 750
reconnect_ms = 1000
emergency_chord = ["LEFT_CONTROL", "LEFT_ALT", "ESCAPE"]
